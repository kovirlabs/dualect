id: io/display
title: "Display of results: a missing `;` and `display`"
status: guided
dialects: [octave, matlab]
match: [syntax:display, call:display]
octave: |
  x = 3               % no semicolon: prints "x = 3"
  y = x / 4           % prints "y = 0.7500"
python: |
  print(f"x = {x}")   # only if the output was wanted
  print(f"y = {y:.4f}")
why: >
  A statement without a terminating semicolon displays its result, which is
  easy to leave in by accident: decide whether the output was intended, and
  usually drop it. When it was, write the print explicitly. The display format
  depends on the value (`x = 3`, `y = 0.7500`, a matrix as aligned columns with
  a common scale factor), so there is no one Python expression for it; this
  rule stays guided. Formatted output is io/printf.
pitfalls:
  - >-
    Number formatting differs (`y = 0.7500` but Python's `0.75`); compare
    values, not printed text.
  - >-
    A call that returns nothing (`disp(x)`, `fprintf(...)`) displays nothing
    extra without a semicolon; only results are displayed.
  - >-
    `x` alone on a line (no assignment) displays `x = ...` too, and an
    expression displays `ans = ...`.
related: [io/printf, syntax/command-syntax]
python_imports: []
