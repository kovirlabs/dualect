id: io/display
title: "Printing: missing `;`, `disp`, `printf` / `fprintf`"
status: guided
dialects: [octave, matlab]
match: [syntax:display, call:disp, call:display, call:printf, call:fprintf]
octave: |
  x = 3               % no semicolon: prints "x = 3"
  disp(x)
  fprintf('%d items\n', n);
python: |
  print(f"x = {x}")
  print(x)
  print(f"{n} items")
why: >
  A statement without a terminating semicolon prints its result, which is easy
  to leave in by accident; decide whether the output was intended. `disp(x)`
  is `print(x)`. `printf`/`fprintf` formats look like C's and map to f-strings,
  but they cycle the format over all elements of array arguments.
pitfalls:
  - >-
    `fprintf('%d\n', [1 2 3])` prints three lines (the format repeats for
    every element); Python needs an explicit loop or `"\n".join(...)`.
  - >-
    `fprintf(fid, ...)` with a file id writes to a file: `print(..., file=f)`.
  - >-
    Number formatting differs (`disp(0.1)` shows `0.1000`); compare values, not
    printed text.
related: [syntax/command-syntax]
python_imports: []
