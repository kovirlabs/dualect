id: operators/power
title: "`^` (matrix power) vs `.^` (element-wise power)"
status: mechanical
dialects: [octave, matlab]
match: [op:mpower, op:power]
octave: |
  P = A ^ 2;          % A * A
  Q = A .^ 2;         % element-wise
python: |
  P = np.linalg.matrix_power(A, 2)
  Q = A**2
why: >
  For a square matrix, `^` is the matrix power (repeated matrix product) and
  `.^` is element-wise. Python's `**` on arrays is element-wise. For scalars
  the two coincide, so `x^2` with scalar `x` is just `x**2`.
pitfalls:
  - >-
    `^` in Python is bitwise XOR: `2 ^ 3` is 1, not 8.
  - >-
    `-2^2` is -4 in both languages (power binds tighter than unary minus), and
    `2^-1` is `2**-1`, 0.5.
  - >-
    NumPy integer arrays raise on negative integer powers
    (`np.arange(1, 4)**-1`); write the exponent as a float (`x**-1.0`) or
    use float data.
  - >-
    NumPy integers wrap around silently on overflow (`np.array([2, 3])**40`,
    `2**np.arange(70)`), where the source computes in doubles; an exponent
    above 2 or a scalar base over an integer array is written as a float
    (`x**40.0`, `2.0**x`). `2.^x` means `2 .^ x`, not `2. ^ x`.
  - >-
    Logical operands are numbers in the source: `m .^ 2` of a mask is 0/1
    doubles, so the mask is converted (`m.astype(int)`) first.
  - >-
    A non-integer matrix power `A^0.5` is `scipy.linalg.fractional_matrix_power`,
    not `A**0.5`.
  - >-
    Old Octave versions accepted `**` as an alias for `^` (matrix power, not
    element-wise); Octave 11 rejects it.
related: [operators/matrix-multiply]
python_imports: [import numpy as np]
