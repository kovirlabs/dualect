id: indexing/grow-on-assign
title: "Growing an array by assigning past its end"
status: mechanical
dialects: [octave, matlab]
match: [assign:grow]
from_python:                  # the Python -> .m direction
  status: mechanical
  match:
    - py:method:append
    - py:call:np.append
    - py:call:np.pad
octave: |
  x(end+1) = v;
  y(5) = 1;           % pads with zeros
python: |
  x = np.append(x, v)
  y = np.pad(y, (0, 5 - y.size))   # when y's length is known
  y[4] = 1
why: >
  Assigning past the end grows an Octave array, filling any gap with zeros.
  NumPy arrays have a fixed size and raise IndexError instead. Collect values
  in a Python list and convert once, or preallocate with `np.zeros` when the
  final size is known; `np.append` copies the whole array on every call.
pitfalls:
  - >-
    `y = []` followed by `y(end+1) = v` in a loop translates statement by
    statement to `y = np.append(y, v)`, which copies the array each time;
    for long loops collect a Python list and convert once after the loop.
  - >-
    `np.append` keeps an integer dtype: `x = [1 2]; x(end+1) = 3; x(1) = 0.5`
    must not store 0.5 into the integer array (it would truncate to 0).
  - >-
    Assigning past the edge of a matrix adds zero-filled rows/columns:
    `A(2, 4) = 1` on a 2x2 makes it 2x4 (`np.pad`, or preallocate).
  - >-
    `x(end+1) = v` on `[]` creates a row; on a column vector it extends the
    column.
related: [indexing/end-in-index, builtins/zeros-ones-eye]
python_imports: [import numpy as np]
