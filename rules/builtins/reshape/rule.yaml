id: builtins/reshape
title: "`reshape`: column-major order"
status: mechanical
dialects: [octave, matlab]
match: [call:reshape]
from_python:                  # the Python -> .m direction
  status: mechanical
  match:
    - py:call:np.reshape
octave: |
  B = reshape(1:6, 2, 3);     % [1 3 5; 2 4 6]
  C = reshape(A, [], 2);      % [] is worked out from numel(A)
  r = reshape(A, 1, []);      % all elements as a row, column by column
python: |
  B = np.reshape(np.arange(1, 7), (2, 3), order="F")
  C = np.reshape(A, (-1, 2), order="F")
  r = A.ravel(order="F")
why: >
  `reshape` keeps the elements in memory order and only changes the
  dimensions, and `.m` arrays are stored column by column: `reshape(1:6, 2, 3)`
  fills the first column with 1 and 2. NumPy's reshape fills rows unless told
  `order="F"`. `[]` for one size is NumPy's `-1`. A `1xN` or `Nx1` result is a
  1-D array, which `ravel(order="F")` gives.
pitfalls:
  - >-
    `np.reshape(x, (2, 3))` without `order="F"` fills row by row: `[[1, 2, 3], [4, 5,
    6]]` instead of `[[1, 3, 5], [2, 4, 6]]`.
  - >-
    `A.ravel()` reads a matrix row by row; `A(:)` and `reshape(A, 1, [])` read
    it column by column: `ravel(order="F")`.
  - >-
    NumPy's reshape returns a view where it can: writing into the result
    writes into the original array. The translation copies when either is
    written later.
related: [indexing/colon-all, indexing/one-based]
python_imports: [import numpy as np]
